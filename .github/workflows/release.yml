name: release

# Release estable por tag v*: compila el frontend (web/) y el binario Go
# estático (CGO_ENABLED=0, front embebido) para amd64 y arm64, genera
# checksums.txt y publica los assets. deploy/install.sh verifica cada
# descarga contra checksums.txt (regla del skill installer-one-liner).

on:
  push:
    tags: ['v*']
  workflow_dispatch: # sin tag = compila y sube como artifact de prueba

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x86_64
            runs-on: ubuntu-latest
          - arch: aarch64
            runs-on: ubuntu-24.04-arm
    runs-on: ${{ matrix.runs-on }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Tests Go
        run: go test ./...

      - name: Build frontend
        working-directory: web
        run: npm ci --no-audit --no-fund && npm run build

      - name: Build binario estático (front embebido)
        env:
          REF: ${{ github.ref_name }}
        run: |
          VERSION="${REF#v}"
          [ "${{ github.ref_type }}" = "tag" ] || VERSION="0.0.0-SNAPSHOT-${GITHUB_SHA::7}"
          rm -rf dist && cp -r web/dist dist
          CGO_ENABLED=0 go build -trimpath \
            -ldflags="-s -w -X main.version=${VERSION} -X main.build=$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
            -o "easyzfs-linux-${{ matrix.arch }}" .
          ls -la "easyzfs-linux-${{ matrix.arch }}"
          file "easyzfs-linux-${{ matrix.arch }}" || true

      - name: Checksums
        run: |
          sha256sum easyzfs-linux-${{ matrix.arch }} > checksums.txt
          cat checksums.txt

      - name: Publica en la release (solo tags)
        if: github.ref_type == 'tag'
        uses: softprops/action-gh-release@v2
        with:
          files: |
            easyzfs-linux-${{ matrix.arch }}
            checksums.txt

      - name: Sube artifact de prueba (solo workflow_dispatch)
        if: github.ref_type != 'tag'
        uses: actions/upload-artifact@v4
        with:
          name: easyzfs-snapshot-linux-${{ matrix.arch }}
          path: |
            easyzfs-linux-${{ matrix.arch }}
            checksums.txt
          retention-days: 7
