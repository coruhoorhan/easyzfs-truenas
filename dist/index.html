<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0e1210">
<meta name="description" content="EasyZFS — Gestión ZFS ligera para servidores caseros">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="manifest" href="/manifest.webmanifest">
<link rel="icon" href="/icons/logo.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="/icons/icon-192.png">
<title>EasyZFS — Gestión ZFS</title>
<script>
// Apariencia inicial antes del primer paint (evita parpadeo):
// tema (auto = prefers-color-scheme del SO), acento y densidad guardados.
(function(){try{
  var t=localStorage.getItem('zfc-theme');
  var dark=t==='dark'||(t!=='light'&&window.matchMedia('(prefers-color-scheme: dark)').matches);
  if(dark)document.documentElement.dataset.theme='dark';
  var ACC={
    cyan:{l:['#0e7c93','#dff0f4'],d:['#4cc3d9','#13292f']},
    violet:{l:['#6d5bd0','#e9e6f8'],d:['#9d8fef','#25203b']},
    emerald:{l:['#2f7d5f','#e3f0e9'],d:['#5cb893','#1d2f27']},
    amber:{l:['#a8741f','#f6ecd9'],d:['#d9a84e','#33291a']}
  };
  var a=ACC[localStorage.getItem('zfc-accent')]||ACC.emerald;
  var v=dark?a.d:a.l,st=document.documentElement.style;
  st.setProperty('--accent',v[0]);st.setProperty('--accent-soft',v[1]);st.setProperty('--ok',v[0]);
  if(localStorage.getItem('zfc-density')==='compact'){
    document.documentElement.dataset.density='compact';st.fontSize='13.5px';
  }
  var m=document.querySelector('meta[name="theme-color"]');
  if(m)m.setAttribute('content',dark?'#0e1210':'#f6f6f3');
}catch(e){}})();
</script>

  <link rel="stylesheet" crossorigin href="/assets/index-B3AasUmS.css">
</head>
<body>
<div id="root"></div>
</body>
</html>
