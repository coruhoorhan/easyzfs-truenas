<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0e1210">
<meta name="description" content="zfsctl — Gestión ZFS ligera para servidores caseros">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="manifest" href="/manifest.webmanifest">
<link rel="icon" href="/icons/icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="/icons/icon-192.png">
<title>zfsctl — Gestión ZFS</title>
<script>
// Tema inicial antes del primer paint (evita parpadeo): auto por hora + override guardado
(function(){try{
  var t=localStorage.getItem('zfc-theme');
  var h=new Date().getHours();
  var dark=t==='dark'||(!t&&(h>=20||h<8));
  if(t==='light')dark=false;
  if(dark)document.documentElement.dataset.theme='dark';
  var m=document.querySelector('meta[name="theme-color"]');
  if(m)m.setAttribute('content',dark?'#0e1210':'#f6f6f3');
}catch(e){}})();
</script>
</head>
<body>
<div id="root"></div>
<script type="module" src="/src/main.tsx"></script>
</body>
</html>
